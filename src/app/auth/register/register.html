<div class="container mt-5">

    <div class="card shadow-lg p-4 col-md-6 mx-auto">

        <h2 class="text-center mb-4">
            Registro de Usuario
        </h2>

        <form (ngSubmit)="registrar()">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="nombre"
                    name="nombre">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Correo
                </label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="correo"
                    name="correo">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    name="password">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="confirmarPassword"
                    name="confirmarPassword">

            </div>

            @if (mensajeError) {

                <div class="alert alert-danger">

                    {{ mensajeError }}

                </div>

            }

            @if (mensajeExito) {

                <div class="alert alert-success">

                    {{ mensajeExito }}

                </div>

            }

            <button
                class="btn btn-success w-100"
                type="submit">

                Registrarse

            </button>

        </form>

    </div>

</div>

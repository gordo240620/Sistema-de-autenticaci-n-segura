<div class="container mt-5">

    <div class="card shadow p-4 col-md-5 mx-auto">

        <h2 class="text-center mb-4">
            Iniciar Sesión
        </h2>

        <form (ngSubmit)="iniciarSesion()">

            <div class="mb-3">
                <label>Correo</label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="correo"
                    name="correo">
            </div>

            <div class="mb-3">
                <label>Contraseña</label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="password"
                    name="password">
            </div>

            <button
                class="btn btn-primary w-100">
                Iniciar sesión
            </button>

        </form>

    </div>

</div>

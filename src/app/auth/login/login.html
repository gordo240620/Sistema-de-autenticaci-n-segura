<div class="container mt-5">

  <div class="card shadow p-4 col-md-5 mx-auto">

    <h2 class="text-center mb-4">
      Iniciar Sesión
    </h2>

    <form (ngSubmit)="iniciarSesion()">

      <div class="mb-3">
        <label class="form-label">Correo</label>

        <input
          type="email"
          class="form-control"
          [(ngModel)]="correo"
          name="correo"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>

        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          required>
      </div>

      @if (mensaje) {
        <div class="alert alert-danger">
          {{ mensaje }}
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100">
        Iniciar Sesión
      </button>

    </form>

  </div>

</div>
